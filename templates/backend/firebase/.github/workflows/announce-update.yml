# After a version is live in the stores: tell users about it in the app.
# Updates the app_versions/<platform> documents in Firestore → the in-app dialog appears
# (optional: a sheet with "Update / Later"; force: a full screen with
# "Update" only). No app release needed.
#
# Daily, it also checks the stores (scripts/store_live.sh): once a version
# is fully live on Google Play (production, not a staged rollout) and the
# App Store, it announces it as an optional update with the store "What's
# new" texts. Forced updates are always by hand. Repo variable
# AUTO_ANNOUNCE=false turns the daily check off.
name: Announce update

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: Optional (Update / Later) or force (Update only)
        type: choice
        default: optional
        options: [optional, force]
      platform:
        description: Platform
        type: choice
        default: both
        options: [both, android, ios]
      version:
        description: Version (empty = latest release tag)
        required: false
        type: string
      changelog_en:
        description: What's new in English (empty = the store text of that release, else its commits)
        required: false
        type: string
      changelog_ar:
        description: What's new in Arabic (empty = the store text of that release)
        required: false
        type: string
      # @@if push
      push:
        description: Also send a push notification to everyone who allowed them
        type: boolean
        default: false
      # @@endif

permissions:
  contents: read

concurrency:
  group: announce-update
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo "::warning::The daily check needs the FIREBASE_SERVICE_ACCOUNT_JSON secret — run tool/setup_secrets.sh."
              exit 0
            fi
            echo "::error::Needs the FIREBASE_SERVICE_ACCOUNT_JSON secret — run tool/setup_secrets.sh."
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          ./scripts/mask_secrets.sh "$RUNNER_TEMP/firebase-sa.json"

      - name: Play key (daily check)
        if: github.event_name == 'schedule'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$PLAY_JSON" ] || exit 0
          umask 077
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          ./scripts/mask_secrets.sh "$RUNNER_TEMP/play.json"

      - name: What to announce
        id: decide
        env:
          ENV_PROD_JSON: ${{ secrets.ENV_PROD_JSON }}
          AUTO_ANNOUNCE: ${{ vars.AUTO_ANNOUNCE }}
          ENABLE_ANDROID: ${{ vars.ENABLE_ANDROID }}
          ENABLE_IOS: ${{ vars.ENABLE_IOS }}
          APP_STORE_COUNTRY: ${{ vars.APP_STORE_COUNTRY }}
        run: |
          # By hand: announce what the inputs say.
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "announce=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$AUTO_ANNOUNCE" = false ]; then
            echo "AUTO_ANNOUNCE=false — the daily check is off."
            exit 0
          fi
          [ -s "$RUNNER_TEMP/firebase-sa.json" ] || exit 0   # warned above
          if [ -s "$RUNNER_TEMP/play.json" ]; then export PLAY_KEY_FILE="$RUNNER_TEMP/play.json"; fi
          live=$(./scripts/store_live.sh)
          rm -f "$RUNNER_TEMP/play.json"
          if [ -z "$live" ]; then
            echo "No version is live in every store yet."
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/v$live" >/dev/null; then
            echo "::warning::$live is live in the stores but there is no tag v$live — announce it by hand."
            exit 0
          fi

          project=$(printf '%s' "$ENV_PROD_JSON" | jq -r '.FIREBASE_PROJECT_ID // empty' 2>/dev/null || true)
          if [ -z "$project" ]; then
            echo "::warning::$live is live, but announcing needs ENV_PROD_JSON with FIREBASE_PROJECT_ID — run tool/setup_secrets.sh."
            exit 0
          fi
          token=$(./scripts/gcp_token.sh "$RUNNER_TEMP/firebase-sa.json")
          base="https://firestore.googleapis.com/v1/projects/$project/databases/(default)/documents/app_versions"
          announced() {
            curl -fsS "$base/$1" -H "Authorization: Bearer $token" |
              jq -r '.fields.latest_version.stringValue // ""'
          }
          platform=$(./scripts/announce_plan.sh "$live" "$(announced android)" "$(announced ios)")
          if [ -z "$platform" ]; then
            echo "$live is already announced."
            exit 0
          fi
          echo "$live is live in the stores → optional update ($platform)"
          {
            echo "announce=true"
            echo "type=optional"
            echo "platform=$platform"
            echo "version=$live"
          } >> "$GITHUB_OUTPUT"

      - name: Update app_versions in Firestore
        if: steps.decide.outputs.announce == 'true'
        env:
          ENV_PROD_JSON: ${{ secrets.ENV_PROD_JSON }}
          TYPE: ${{ steps.decide.outputs.type || inputs.type }}
          PLATFORM: ${{ steps.decide.outputs.platform || inputs.platform }}
          VERSION: ${{ steps.decide.outputs.version || inputs.version }}
          CHANGELOG_EN: ${{ inputs.changelog_en }}
          CHANGELOG_AR: ${{ inputs.changelog_ar }}
        run: |
          project=$(printf '%s' "$ENV_PROD_JSON" | jq -r '.FIREBASE_PROJECT_ID // empty' 2>/dev/null || true)
          if [ -z "$project" ]; then
            echo "::error::Needs ENV_PROD_JSON with FIREBASE_PROJECT_ID — run tool/setup_secrets.sh."
            exit 1
          fi
          token=$(./scripts/gcp_token.sh "$RUNNER_TEMP/firebase-sa.json")

          tag=${VERSION:+v${VERSION#v}}
          [ -n "$tag" ] || tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          version=${tag#v}
          git rev-parse "$tag" >/dev/null 2>&1 || { echo "::error::Tag $tag not found."; exit 1; }
          [ -n "$CHANGELOG_EN" ] || CHANGELOG_EN=$(./scripts/whats_new.sh "$tag" en)
          [ -n "$CHANGELOG_AR" ] || CHANGELOG_AR=$(./scripts/whats_new.sh "$tag" ar)

          fields=(latest_version changelog_en changelog_ar updated_at)
          [ "$TYPE" = force ] && fields+=(min_supported_version)
          mask=$(printf '&updateMask.fieldPaths=%s' "${fields[@]}")
          body=$(jq -n --arg v "$version" --arg en "$CHANGELOG_EN" --arg ar "$CHANGELOG_AR" '
            {fields: {latest_version: {stringValue: $v}, min_supported_version: {stringValue: $v},
                      changelog_en: {stringValue: $en}, changelog_ar: {stringValue: $ar},
                      updated_at: {timestampValue: (now | todate)}}}')

          base="https://firestore.googleapis.com/v1/projects/$project/databases/(default)/documents/app_versions"
          case "$PLATFORM" in both) platforms="android ios" ;; *) platforms=$PLATFORM ;; esac
          for p in $platforms; do
            # currentDocument.exists=true: update only (Firebase deploy seeds the documents).
            code=$(curl -sS -o "$RUNNER_TEMP/announce.json" -w '%{http_code}' -X PATCH \
              "$base/$p?currentDocument.exists=true$mask" \
              -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d "$body")
            if [ "$code" = 200 ]; then
              echo "✓ $p → $version ($TYPE)"
            else
              echo "::error::app_versions/$p not updated (HTTP $code): $(jq -r '.error.message // empty' "$RUNNER_TEMP/announce.json")"
              exit 1
            fi
          done
          rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/announce.json"
          {
            echo "### 📣 $version announced ($TYPE) — $PLATFORM"
            echo
            echo "$CHANGELOG_EN"
          } >> "$GITHUB_STEP_SUMMARY"
      # @@if push

      - name: Push notification
        if: inputs.push && steps.decide.outputs.announce == 'true'
        env:
          ENV_PROD_JSON: ${{ secrets.ENV_PROD_JSON }}
          PUSH_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VERSION: ${{ inputs.version }}
          CHANGELOG_EN: ${{ inputs.changelog_en }}
          CHANGELOG_AR: ${{ inputs.changelog_ar }}
        run: |
          project=$(printf '%s' "$ENV_PROD_JSON" | jq -r '.FIREBASE_PROJECT_ID // empty' 2>/dev/null || true)
          if [ -z "$project" ] || [ -z "$PUSH_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Push needs ENV_PROD_JSON with FIREBASE_PROJECT_ID and the FIREBASE_SERVICE_ACCOUNT_JSON secret (docs/features/push.md)."
            exit 1
          fi
          umask 077
          printf '%s' "$PUSH_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/push-sa.json"
          ./scripts/mask_secrets.sh "$RUNNER_TEMP/push-sa.json"

          tag=${VERSION:+v${VERSION#v}}
          [ -n "$tag" ] || tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          [ -n "$CHANGELOG_EN" ] || CHANGELOG_EN=$(./scripts/release_notes.sh plain "$tag" | head -n 3)
          ./scripts/send_push.sh "$RUNNER_TEMP/push-sa.json" "$project" \
            "__APP_NAME__ ${tag#v}" "$CHANGELOG_EN" \
            "__APP_NAME__ ${tag#v}" "${CHANGELOG_AR:-$CHANGELOG_EN}"
          rm -f "$RUNNER_TEMP/push-sa.json"
          echo "🔔 Push sent to updates_en and updates_ar" >> "$GITHUB_STEP_SUMMARY"
      # @@endif

      - name: Remove the keys
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/play.json" "$RUNNER_TEMP/push-sa.json"
