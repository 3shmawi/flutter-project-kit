name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.4.2 (123)
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Both]
  - type: input
    id: device
    attributes:
      label: Device / OS
      placeholder: Pixel 8, Android 15
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, Sentry link, logs
