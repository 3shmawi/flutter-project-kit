# Backend as code: every change under supabase/ that reaches main is
# deployed — migrations (`supabase db push`) and Edge Functions.
# Secrets (tool/setup_secrets.sh): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
# and ENV_PROD_JSON (the project ref is read from its SUPABASE_URL).
# Keep migrations backward compatible: the live app keeps running while the
# store review of the new version is pending.
name: Supabase deploy

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ENV_PROD_JSON: ${{ secrets.ENV_PROD_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Project ref
        id: ref
        run: |
          url=$(printf '%s' "$ENV_PROD_JSON" | jq -r '.SUPABASE_URL // empty' 2>/dev/null || true)
          ref=$(printf '%s' "$url" | sed -nE 's#^https://([a-z0-9]+)\.supabase\.co.*#\1#p')
          if [ -z "$ref" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase deploy skipped — needs SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_URL in ENV_PROD_JSON (tool/setup_secrets.sh)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.ref.outputs.ready == 'true'
        with:
          # Pinned: "latest" asks the GitHub API on every run and gets rate-limited.
          version: 2.120.0

      # The CLI reads SUPABASE_DB_PASSWORD from the environment, so the
      # password never appears in a command line.
      - name: Push migrations
        if: steps.ref.outputs.ready == 'true'
        run: |
          [ -f supabase/config.toml ] || supabase init </dev/null
          supabase link --project-ref "$PROJECT_REF"
          supabase db push

      - name: Deploy Edge Functions
        if: steps.ref.outputs.ready == 'true' && hashFiles('supabase/functions/**') != ''
        run: supabase functions deploy --project-ref "$PROJECT_REF"
