# Merge to main → version from Conventional Commits → Play + App Store.
# Setup: docs/release.md · secrets: ./scripts/setup_secrets.sh
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: auto
        options: [auto, patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    name: Decide version
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      build: ${{ steps.next.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: next
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '0' }}
        run: |
          version="$(./scripts/next_version.sh "$BUMP")"
          if [ "$version" = "skip" ]; then
            echo "Only docs/chore/ci/test/style commits — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          build=$(( GITHUB_RUN_NUMBER + OFFSET ))
          echo "Releasing $version ($build)"
          {
            echo "release=true"
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android → Google Play
    needs: version
    if: needs.version.outputs.release == 'true' && vars.ENABLE_ANDROID != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Env file & signing
        env:
          ENV_PROD_JSON: ${{ secrets.ENV_PROD_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ENV_PROD_JSON" ]; then printf '%s' "$ENV_PROD_JSON" > env/prod.json; else cp env/example.json env/prod.json; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build app bundle
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build appbundle --release __FLAVOR_FLAG__ \
            --dart-define-from-file=env/prod.json \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ needs.version.outputs.build }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: __PACKAGE_ID__
          releaseFiles: __AAB_PATH__
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

  ios:
    name: iOS → App Store Connect
    needs: version
    if: needs.version.outputs.release == 'true' && vars.ENABLE_IOS != 'false'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install Codemagic CLI tools
        run: pipx install codemagic-cli-tools

      - name: Env file & packages
        env:
          ENV_PROD_JSON: ${{ secrets.ENV_PROD_JSON }}
        run: |
          if [ -n "$ENV_PROD_JSON" ]; then printf '%s' "$ENV_PROD_JSON" > env/prod.json; else cp env/example.json env/prod.json; fi
          flutter pub get
          flutter gen-l10n

      - name: Code signing (fetched from App Store Connect)
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "__PACKAGE_ID__" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        run: |
          flutter build ipa --release __FLAVOR_FLAG__ \
            --dart-define-from-file=env/prod.json \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ needs.version.outputs.build }} \
            --export-options-plist="$HOME/export_options.plist"

      - name: Upload to App Store Connect
        run: app-store-connect publish --path "$(find build/ios/ipa -name '*.ipa' | head -n 1)"

  github-release:
    name: Tag & GitHub release
    needs: [version, android, ios]
    if: >-
      always() && needs.version.outputs.release == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "v$VERSION ($BUILD)" --generate-notes
