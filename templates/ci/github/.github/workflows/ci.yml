name: CI

on:
  pull_request:
  workflow_call:

# Read-only token by default; a job that must write asks for it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format · analyze · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      # Before pub get, so generated l10n files aren't checked.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Install packages
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Unit, widget & security tests
        run: flutter test --coverage

      - name: Coverage threshold
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '60' }}
        run: ./scripts/coverage_check.sh

  security:
    name: Security scan · secrets · dependencies · database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secrets in git history (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git --no-banner --redact -v /repo

      - name: Vulnerable dependencies (OSV-Scanner)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0 \
            scan source --lockfile=/src/pubspec.lock

      # Workflow security: pinned actions, least-privilege tokens, no
      # credentials left on disk, no untrusted text run as shell code.
      # docs/security.md → "CI and secrets".
      - name: Workflow security (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --min-severity low --format github .github/workflows

      # Runs once `supabase init` has created supabase/config.toml.
      # RLS tests run when a PR touches supabase/ (or on manual runs).
      - name: Supabase changes?
        id: supabase
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "::notice::No supabase/config.toml — RLS tests skipped (run 'supabase init' once)."
          elif [ -z "$BASE_REF" ] || git diff --name-only "origin/$BASE_REF...HEAD" | grep -q '^supabase/'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under supabase/ — RLS tests skipped."
          fi

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.supabase.outputs.present == 'true'
        with:
          # Pinned: "latest" asks the GitHub API on every run and gets rate-limited.
          version: 2.120.0

      - name: Database security tests (RLS, pgTAP)
        if: steps.supabase.outputs.present == 'true'
        run: |
          supabase db start
          supabase test db

  integration:
    name: Integration tests (Android emulator)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install packages
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # GLASS_LITE: the emulator has no real GPU and glass shaders stall it
          # (glass apps draw the solid variant; other apps ignore the define).
          script: flutter test integration_test __TEST_FLAVOR_FLAG__ --dart-define-from-file=env/example.json --dart-define=GLASS_LITE=true
