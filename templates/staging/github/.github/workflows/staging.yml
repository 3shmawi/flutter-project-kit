# Staging builds for testers on every push to `develop`:
#   Android → APK attached to a "staging" pre-release (install from the link)
#   iOS     → TestFlight of the staging app (__PACKAGE_ID__.stg)
# One-time: create the app record for __PACKAGE_ID__.stg in App Store
# Connect, and `gh secret set ENV_STAGING_JSON < env/staging.json`
# (tool/setup_secrets.sh does it).
name: Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

# Read-only token by default; a job that must write asks for it itself.
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] nothing is cloned before it

  version:
    name: Staging version
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      android: ${{ steps.v.outputs.android }}
      ios: ${{ steps.v.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: v
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
        run: |
          next=$(./scripts/next_version.sh auto)
          [ "$next" = skip ] && next=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')
          [ -n "$next" ] || next=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          [ -n "$KEYSTORE" ] && echo "android=true" >> "$GITHUB_OUTPUT" || echo "android=false" >> "$GITHUB_OUTPUT"
          [ -n "$ASC_KEY" ] && [ -n "$IOS_CERT" ] && echo "ios=true" >> "$GITHUB_OUTPUT" || echo "ios=false" >> "$GITHUB_OUTPUT"

  android:
    name: Android staging APK
    needs: version
    if: needs.version.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # publishes the pre-release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true
      - name: Env file & signing
        env:
          ENV_STAGING_JSON: ${{ secrets.ENV_STAGING_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ENV_STAGING_JSON" ]; then printf '%s' "$ENV_STAGING_JSON" > env/staging.json; else cp env/example.json env/staging.json; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build APK
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --release --flavor staging \
            --dart-define-from-file=env/staging.json \
            --build-name=$VERSION \
            --build-number=$BUILD
      - name: Publish as pre-release (keeps the last 3)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: staging-${{ needs.version.outputs.version }}-${{ needs.version.outputs.build }}
        run: |
          apk=$(find build/app/outputs/flutter-apk -name '*staging-release.apk' | head -n 1)
          cp "$apk" "__PROJECT_NAME__-staging-$VERSION-$BUILD.apk"
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Staging $VERSION ($BUILD)" \
            --notes "Branch develop @ ${GITHUB_SHA::7}. Install the APK on Android." \
            ./__PROJECT_NAME__-staging-*.apk
          gh release list --limit 50 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease and (.tagName | startswith("staging-"))) | .tagName' \
            | tail -n +4 | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
          echo "### 📦 Staging APK: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS staging → TestFlight
    needs: version
    if: needs.version.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true
      # Apple only accepts uploads built with Xcode 26 or newer (since
      # April 2026). Use the newest Xcode on the runner; fail clearly if
      # the runner has none new enough.
      - name: Xcode 26 or newer
        run: |
          major() { xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }'; }
          if [ "$(major)" -lt 26 ]; then
            newest=$(find /Applications -maxdepth 1 -name 'Xcode_2[6-9]*.app' | sort -V | tail -n 1)
            [ -n "$newest" ] || { echo "::error::App Store uploads need Xcode 26+; this runner has $(xcodebuild -version | head -n 1)."; exit 1; }
            sudo xcode-select -s "$newest/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install Codemagic CLI tools
        run: pipx install codemagic-cli-tools==0.70.2
      - name: Env file & packages
        env:
          ENV_STAGING_JSON: ${{ secrets.ENV_STAGING_JSON }}
        run: |
          if [ -n "$ENV_STAGING_JSON" ]; then printf '%s' "$ENV_STAGING_JSON" > env/staging.json; else cp env/example.json env/staging.json; fi
          flutter pub get
          flutter gen-l10n
      - name: Code signing (staging bundle id)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          signing="$RUNNER_TEMP/signing"; mkdir -p "$signing"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$signing/asc.p8"
          printf '%s' "$P12_BASE64" | base64 --decode > "$signing/dist.p12"
          openssl pkcs12 -in "$signing/dist.p12" -nocerts -nodes -passin env:P12_PASSWORD -out "$signing/raw.pem" 2>/dev/null \
            || openssl pkcs12 -legacy -in "$signing/dist.p12" -nocerts -nodes -passin env:P12_PASSWORD -out "$signing/raw.pem"
          # Only the key: openssl adds "Bag Attributes" lines that the CLI
          # rejects, and its error message would print the whole file.
          openssl pkey -in "$signing/raw.pem" -out "$signing/key.pem" && rm -f "$signing/raw.pem"
          # Never let a key appear in a log (this repo's logs may be public).
          ./scripts/mask_secrets.sh "$signing/key.pem" "$signing/asc.p8"
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$signing/asc.p8"
          export CERTIFICATE_PRIVATE_KEY="@file:$signing/key.pem"
          echo "APP_STORE_CONNECT_PRIVATE_KEY=@file:$signing/asc.p8" >> "$GITHUB_ENV"
          keychain initialize
          keychain add-certificates --certificate "$signing/dist.p12" --certificate-password "@env:P12_PASSWORD"
          app-store-connect fetch-signing-files "__PACKAGE_ID__.stg" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        run: |
          flutter build ipa --release --flavor staging \
            --dart-define-from-file=env/staging.json \
            --build-name=$VERSION \
            --build-number=$BUILD \
            --export-options-plist="$HOME/export_options.plist"
      - name: Upload to TestFlight
        run: app-store-connect publish --path "$(find build/ios/ipa -name '*.ipa' | head -n 1)"
