# Actions → "Create project" → Run workflow → fill the form.
# Creates a new GitHub repo with the full project, CI secrets and Pages.
# One-time setup: ./setup_kit_repo.sh (see README).
name: Create project

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App display name (e.g. Cafe Menu)
        required: true
        type: string
      package_id:
        description: Package / bundle ID (empty = <DEFAULT_ORG>.<appname>)
        required: false
        type: string
      description:
        description: One-line description
        required: false
        type: string
      environments:
        description: Environments
        type: choice
        default: full
        options: [full, staging-prod, prod]
      architecture:
        description: Architecture (decided in the idea discussion)
        type: choice
        default: simple
        options: [simple, layered]
      state_management:
        description: State management
        type: choice
        default: bloc
        options: [bloc, riverpod, none]
      monitoring:
        description: Monitoring
        type: choice
        default: sentry
        options: [sentry, clarity, none]
      ci:
        description: CI/CD (github → public repo, codemagic → private repo)
        type: choice
        default: github
        options: [github, codemagic]
      primary_color:
        description: Primary color (hex)
        required: false
        default: '#4F46E5'
        type: string
      deeplink_domain:
        description: Domain for https deep links (optional)
        required: false
        type: string

concurrency:
  group: create-project
  cancel-in-progress: false

jobs:
  create:
    name: Create ${{ inputs.app_name }}
    # macOS so iOS flavors (Xcode schemes) are generated too.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Check setup
        env:
          KIT_GH_TOKEN: ${{ secrets.KIT_GH_TOKEN }}
        run: |
          if [ -z "$KIT_GH_TOKEN" ]; then
            echo "::error::Secret KIT_GH_TOKEN is missing — run ./setup_kit_repo.sh once (see README)."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || '3.47.8' }}
          cache: true

      - name: GitHub identity
        env:
          GH_TOKEN: ${{ secrets.KIT_GH_TOKEN }}
        run: |
          gh auth setup-git
          login=$(gh api user --jq .login)
          id=$(gh api user --jq .id)
          name=$(gh api user --jq '.name // .login')
          git config --global user.name "$name"
          git config --global user.email "$id+$login@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Prepare inputs
        env:
          DEFAULT_ORG: ${{ vars.DEFAULT_ORG }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER }}
          DEVELOPER_NAME: ${{ vars.DEVELOPER_NAME }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          DEFAULT_PRIMARY_COLOR: ${{ vars.DEFAULT_PRIMARY_COLOR }}
          FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION || '3.47.8' }}
          CODEMAGIC_ASC_INTEGRATION: ${{ vars.CODEMAGIC_ASC_INTEGRATION }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          IN_APP_NAME: ${{ inputs.app_name }}
          IN_PACKAGE_ID: ${{ inputs.package_id }}
          IN_DESCRIPTION: ${{ inputs.description }}
          IN_ENVIRONMENTS: ${{ inputs.environments }}
          IN_ARCHITECTURE: ${{ inputs.architecture }}
          IN_STATE: ${{ inputs.state_management }}
          IN_MONITORING: ${{ inputs.monitoring }}
          IN_CI: ${{ inputs.ci }}
          IN_PRIMARY_COLOR: ${{ inputs.primary_color }}
          IN_DEEPLINK_DOMAIN: ${{ inputs.deeplink_domain }}
        run: ./.github/scripts/write_kit_inputs.sh "$RUNNER_TEMP/kit"

      - name: Generate project & create repo
        env:
          GH_TOKEN: ${{ secrets.KIT_GH_TOKEN }}
          FLUTTER_KIT_CONFIG: ${{ runner.temp }}/kit/kit.conf
          KIT_USE_FVM: 'false'
        run: |
          ./new_project.sh --answers "$RUNNER_TEMP/kit/answers.env" --yes 2>&1 | tee "$RUNNER_TEMP/kit/run.log"

      - name: Summary
        if: always()
        run: |
          project=$(ls -d "$RUNNER_TEMP"/kit/projects/*/ 2>/dev/null | head -n 1 || true)
          {
            echo "## ${{ inputs.app_name }}"
            if [ -n "$project" ] && remote=$(git -C "$project" remote get-url origin 2>/dev/null); then
              echo "Repository: ${remote%.git}"
            fi
            echo
            echo '```'
            sed -n '/━━ Done/,$p' "$RUNNER_TEMP/kit/run.log" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-project-logs
          path: |
            ${{ runner.temp }}/kit/run.log
            ${{ runner.temp }}/kit/projects/*/analyze.log
            ${{ runner.temp }}/kit/projects/*/test.log
            ${{ runner.temp }}/kit/projects/*/flavorizr.log
          if-no-files-found: ignore

      - name: Remove credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/kit/creds"
