# Every Monday: when 3shmawi/social-publisher has a newer vX.Y.Z tag (it tags
# itself on each release), opens a PR that moves the templates' pins to it.
# Validate kit then checks the PR like any other; apps get it through kit
# sync. The PR is opened with KIT_GH_TOKEN so that CI runs on it (PRs opened
# with the job token start no workflows), and merged here once every check
# on it has passed (it stays open when one fails — fix it like any PR).
name: Bump social-publisher

on:
  schedule:
    - cron: '29 5 * * 1'   # Mondays 05:29 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-social-publisher
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bump:
    runs-on: ubuntu-latest
    # Validate kit's macOS job takes ~30 min; the job waits for it.
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.KIT_GH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Newest social-publisher
        id: bump
        run: ./.github/scripts/bump_social_publisher.sh

      - name: Open the PR
        id: pr
        if: steps.bump.outputs.changed != ''
        env:
          TAG: ${{ steps.bump.outputs.changed }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret KIT_GH_TOKEN is missing — run ./setup_kit_repo.sh once (see README)."
            exit 1
          fi
          branch="chore/social-publisher-$TAG"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "A PR for $TAG is already open."; exit 0
          fi
          gh auth setup-git
          login=$(gh api user --jq .login)
          id=$(gh api user --jq .id)
          git config user.name "$login"
          git config user.email "$id+$login@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "chore(deps): social-publisher $TAG"
          git push -q --force-with-lease origin "$branch"
          gh pr create --head "$branch" --title "chore(deps): social-publisher $TAG" --body "Moves the social workflows in \`templates/base/.github/workflows/\` to [social-publisher $TAG](https://github.com/3shmawi/social-publisher/releases/tag/$TAG) (opened by the weekly *Bump social-publisher* workflow). Validate kit checks the generated apps; after merging, apps get it through kit sync."

      # Merge only when green: wait for the checks to appear, then for all of
      # them to pass. A failed check leaves the PR open for a person.
      - name: Merge when green
        if: steps.pr.outputs.branch != ''
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          for _ in $(seq 1 30); do
            count=$(gh pr checks "$BRANCH" --json name --jq 'length' 2>/dev/null || echo 0)
            [ "${count:-0}" -gt 0 ] && break
            sleep 20
          done
          if ! gh pr checks "$BRANCH" --watch --fail-fast --interval 60; then
            echo "::warning::A check failed on the $BRANCH PR; it stays open for review."
            exit 0
          fi
          gh pr merge "$BRANCH" --squash --delete-branch
          echo "Merged the $BRANCH PR."

